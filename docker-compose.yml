version: '3.9'

services:
  WeatherDatabase:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: weatherapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - weather-net

  flask-app:
    build: ./FlaskDatabase
    ports:
      - "5000:5000"
    environment:
      DB_HOST: WeatherDatabase
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: weatherapp
    depends_on:
      - WeatherDatabase
    networks:
      - weather-net

volumes:
  db_data:

networks:
  weather-net:
